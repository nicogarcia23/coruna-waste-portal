apiVersion: 1
contactPoints:
  - orgId: 1
    name: slack-waste-ops
    receivers:
      - uid: slack-receiver
        type: slack
        settings:
          url: ${GRAFANA_SLACK_WEBHOOK_URL}
          title: "Waste Portal Alert"
          text: "{{ template \"default.message\" . }}"

  - orgId: 1
    name: backend-webhook
    receivers:
      - uid: backend-receiver
        type: webhook
        settings:
          url: ${GRAFANA_BACKEND_WEBHOOK_URL}
          httpMethod: POST

policies:
  - orgId: 1
    receiver: slack-waste-ops
    groupBy: [alertname, district]
    routes:
      - receiver: backend-webhook
        matchers:
          - severity = critical

groups:
  - orgId: 1
    name: container-alerts
    folder: waste-portal
    interval: 5m
    rules:
      - uid: alert-near-overflow
        title: Container Near Overflow
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container fill level >= 90%"
        data:
          - refId: A
            datasourceUid: TimescaleDB
            model:
              rawSql: >
                SELECT NOW() AS time, entity_id, fill_level
                FROM etwasteobserved
                WHERE fill_level >= 90
                AND time_index >= NOW() - INTERVAL '15 minutes'
                ORDER BY fill_level DESC
          - refId: C
            type: classic_conditions
            model:
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: count}

      - uid: alert-stale-data
        title: Stale IoT Data
        condition: C
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "No observations received in last 30 minutes"
        data:
          - refId: A
            datasourceUid: TimescaleDB
            model:
              rawSql: >
                SELECT COUNT(*) AS count
                FROM etwasteobserved
                WHERE time_index >= NOW() - INTERVAL '30 minutes'
          - refId: C
            type: classic_conditions
            model:
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: last}
